name : ci-wf
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
jobs:
  linting-job:
    runs-on: ubuntu-latest
    steps:
    -  name: welcome steps
       run: echo "welcome to linting"
    -  name: clone repository
       uses: actions/checkout@v4
    -  name : install HTMLHint
       run : npm install --save-dev htmlhint
    -  name: lint html
       run: npx htmlhint "**/*.html"
